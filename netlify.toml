# Herbig Group — Netlify configuration (HG-P4-07 / P9-04 / P9-05)
#
# The site is still plain static files; stamp.js rewrites asset references to
# content-hashed URLs in the build workspace so the long-lived cache headers in
# _headers are safe. Nothing is generated, bundled or minified here, and the
# repository keeps ordinary filenames.
#
# One function now sits in front of the inquiry forms (netlify/functions).
# Native Netlify Forms accepts a POST straight from the browser, which left
# server-side validation and duplicate prevention with nowhere to live; the
# function is that boundary. It validates and de-duplicates, then forwards to
# the form store, so the dashboard, spam quarantine and notifications are
# unchanged. See netlify/functions/inquiry.mjs.
#
# The build command is still just `node stamp.js`. The function has no
# dependencies on purpose, so there is no npm install here - an install that
# fails fails the deploy, and the live site with it.

[build]
  command = "node stamp.js"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The publish root is the repository root, so without this the function source
# and node_modules would also be served as static files. They are not secret,
# but they are not part of the site either.
[[headers]]
  for = "/netlify/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
